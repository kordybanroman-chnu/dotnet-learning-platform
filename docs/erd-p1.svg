<text x="442" y="403">CourseId : bigint [PK,FK]</text>
<text x="442" y="423">CourseTitle : snapshot</text>
<text x="442" y="443">UnitPrice : snapshot</text>
<text x="442" y="463">Units : int</text>
</g>
